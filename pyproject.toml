[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-protocol-failover-router"
version = "0.1.0"
description = "High-availability MCP tool cluster router with active health checks, circuit breakers, and automatic standby failover"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
mcp-protocol-failover-router = "mcp_protocol_failover_router.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_protocol_failover_router*"]
